<style>
:root{--ink:#132d43;--muted:#607589;--line:#dce5eb;--paper:#f3f7f8;--white:#fff;--navy:#10283f;--teal:#19a88b;--lime:#c8ec74;--red:#b83e4b;--shadow:0 12px 30px rgba(18,48,68,.08);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:20px 18px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;background:var(--lime);border-radius:15px;display:grid;place-items:center;font-size:25px}.brand h1{font-size:20px;line-height:1;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:12px}.privacy{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.privacy i{width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block}.nav{display:flex;gap:8px;overflow:auto;padding:4px;margin:0 0 18px}.nav button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:9px 15px;color:var(--muted);background:var(--white)}.nav button.active{background:var(--navy);border-color:var(--navy);color:white}.hero{background:var(--navy);color:white;border-radius:24px;padding:25px 26px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-70px;top:-120px;background:rgba(200,236,116,.13)}.hero-row{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.eyebrow{color:#a6bbca;text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:700}.hero h2{font-size:27px;margin:8px 0 5px;letter-spacing:-.03em}.hero p{margin:0;color:#c1d0d8;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;transition:.15s}.btn.primary{background:var(--lime);color:#142b3e}.btn.secondary{background:#fff;color:var(--navy)}.btn.ghost{background:#e8eff2;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0f1;color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.btn:hover{transform:translateY(-1px)}.year-row{display:flex;align-items:center;gap:8px;margin:20px 0 12px}.year-row label{font-size:13px;color:var(--muted);font-weight:600}.year-row select{border:1px solid var(--line);border-radius:10px;padding:8px 30px 8px 10px;background:white;color:var(--ink);font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid #e8eef1;border-radius:17px;padding:17px;box-shadow:0 4px 14px rgba(18,48,68,.035)}.card .label{font-size:12px;color:var(--muted);font-weight:600}.card .value{font-size:24px;font-weight:750;margin-top:7px;letter-spacing:-.03em}.card .sub{font-size:11px;color:#8293a1;margin-top:5px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.panel{background:white;border:1px solid #e8eef1;border-radius:18px;padding:18px;box-shadow:0 4px 14px rgba(18,48,68,.035)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.panel h3{margin:0;font-size:15px}.panel-head .hint{font-size:11px;color:var(--muted)}.bars{display:grid;grid-template-columns:repeat(12,1fr);align-items:end;gap:7px;height:155px;padding-top:12px}.bar-col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}.bar{width:100%;max-width:34px;min-height:3px;background:#b6e5d8;border-radius:7px 7px 3px 3px;position:relative}.bar.emph{background:var(--teal)}.bar-col span{font-size:10px;color:var(--muted)}.bar-col small{font-size:9px;color:#81919d;min-height:11px}.metric-list{display:grid;gap:0}.metric-line{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf1f3;font-size:13px}.metric-line:last-child{border:0}.metric-line span{color:var(--muted)}.metric-line strong{font-weight:700}.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:5px 0 16px}.page-title h2{font-size:24px;margin:0 0 5px}.page-title p{margin:0;color:var(--muted);font-size:13px}.list{display:grid;gap:9px}.entry{background:white;border:1px solid #e5ecef;border-radius:15px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.entry-main{min-width:0}.entry-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.entry-top strong{font-size:14px}.tag{background:#e9f6f1;color:#147b66;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:700}.entry-note{color:var(--muted);font-size:12px;margin-top:5px;overflow-wrap:anywhere}.entry-meta{font-size:12px;color:#405c70;margin-top:7px}.entry-actions{display:flex;gap:6px}.empty{background:white;border:1px dashed #cbd8df;border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted);font-size:13px}.sync-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.sync-card{background:white;border:1px solid #e5ecef;border-radius:17px;padding:18px}.sync-card h3{margin:0 0 7px;font-size:15px}.sync-card p{margin:0 0 15px;color:var(--muted);font-size:12px;line-height:1.5}.sync-card .row{display:flex;gap:8px;flex-wrap:wrap}.notice{background:#eef5f8;border:1px solid #dae7ed;border-radius:14px;padding:14px 16px;color:#446075;font-size:12px;line-height:1.55;margin-top:14px}.notice strong{color:var(--ink)}.status{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:#10283f;color:white;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.status.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:rgba(6,25,40,.42);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:14px}.modal.open{display:flex}.dialog{width:min(100%,520px);max-height:92vh;overflow:auto;background:white;border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.dialog-head h3{margin:0;font-size:18px}.close{border:0;background:#edf2f4;width:34px;height:34px;border-radius:50%;font-size:20px;color:var(--ink)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#50677a}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e3e8;border-radius:11px;background:#fbfcfd;padding:11px 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(25,168,139,.13)}.field textarea{min-height:68px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.hidden{display:none!important}.footer{margin-top:20px;text-align:center;color:#81919d;font-size:11px}.search{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:150px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:760px){.app{padding:15px 13px 35px}.hero{padding:21px 18px}.hero-row{align-items:flex-start;flex-direction:column}.hero h2{font-size:23px}.cards{grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:14px}.card .value{font-size:21px}.grid{grid-template-columns:1fr}.sync-grid{grid-template-columns:1fr}.bars{gap:4px;height:135px}.bar-col span{font-size:9px}.bar-col small{font-size:8px}.entry{padding:13px}.entry-actions{flex-direction:column}.privacy{font-size:0}.privacy i{width:9px;height:9px}.page-title{align-items:flex-start;flex-direction:column}.search{min-width:0;width:100%}}

<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">⚡</div><div><h1>E‑Auto 365</h1><p>Dein Fahrten- und Kostenbuch</p></div></div><div class="privacy" title="Deine Daten bleiben auf diesem Gerät"><i></i> Nur auf diesem Gerät</div></header>
<nav class="nav" aria-label="Hauptnavigation"><button class="active" data-view="home">Übersicht</button><button data-view="charges">Ladevorgänge</button><button data-view="costs">Sonstige Kosten</button><button data-view="sync">Excel-Austausch</button></nav>
<main id="view"></main>
<div class="footer">Offline nutzbar · Daten werden lokal im Browser gespeichert</div>
</div>
<div id="modal" class="modal"><section class="dialog"><div class="dialog-head"><h3 id="formTitle">Eintrag</h3><button class="close" type="button" aria-label="Schließen" id="closeModal">×</button></div><form id="entryForm"><div id="formFields" class="form-grid"></div><div class="form-actions"><button class="btn ghost" type="button" id="cancelForm">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></form></section></div>
<div id="status" class="status"></div>
<input type="file" id="importCharges" accept=".csv,text/csv" class="hidden"><input type="file" id="importCosts" accept=".csv,text/csv" class="hidden"><input type="file" id="importBackup" accept=".json,application/json" class="hidden">
<script>
(()=>{
const KEY='eauto365.v1';
const blank=()=>({charges:[],costs:[]});
let db=loadDB(), view='home', year=(new Date()).getFullYear(), editing=null, searchTerm='';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function loadDB(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return {charges:Array.isArray(x.charges)?x.charges:[],costs:Array.isArray(x.costs)?x.costs:[]}}catch{return blank()}}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('Speicher voll oder nicht verfügbar. Bitte zuerst CSV sichern.');return false}}
function id(){return self.crypto&&crypto.randomUUID?crypto.randomUUID():'ea-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return Number.isFinite(Number(v))?Number(v):0}
function euro(n,d=2){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d}).format(num(n))}
function number(n,d=1){return new Intl.NumberFormat('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}).format(num(n))}
function dateDE(s){if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:s}
function toast(s){const n=$('#status');n.textContent=s;n.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('show'),2800)}
function chargeRows(){const a=[...db.charges].sort((x,y)=>x.date.localeCompare(y.date)||num(x.odometer)-num(y.odometer));return a.map((x,i)=>{let km=0;if(i>0){const prev=num(a[i-1].odometer);km=Math.max(0,num(x.odometer)-prev)}return {...x,drivenKm:km,kwh100:km>0?num(x.kwh)/km*100:0,cost100:km>0?num(x.cost)/km*100:0}})}
function aggregate(y){const cs=chargeRows().filter(x=>String(x.date).slice(0,4)===String(y)), es=db.costs.filter(x=>String(x.date).slice(0,4)===String(y));const kwh=cs.reduce((s,x)=>s+num(x.kwh),0), km=cs.reduce((s,x)=>s+num(x.drivenKm),0), charge=cs.reduce((s,x)=>s+num(x.cost),0), other=es.reduce((s,x)=>s+num(x.amount),0);return {kwh,km,charge,other,total:charge+other,kwh100:km?kwh/km*100:0,costKm:km?(charge+other)/km:0,cs,es}}
function years(){const set=new Set([new Date().getFullYear(),...db.charges.map(x=>Number(String(x.date).slice(0,4))),...db.costs.map(x=>Number(String(x.date).slice(0,4)))]);return [...set].filter(Number.isFinite).sort((a,b)=>b-a)}
function stat(label,value,sub){return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function render(){ $$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view)); const root=$('#view'); if(view==='home')root.innerHTML=home(); else if(view==='charges')root.innerHTML=chargesPage(); else if(view==='costs')root.innerHTML=costsPage(); else root.innerHTML=syncPage(); bind(); }
function yearSelect(){return `<div class="year-row"><label for="year">Auswertungsjahr</label><select id="year">${years().map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}</select></div>`}
function home(){const a=aggregate(year), months=Array.from({length:12},(_,i)=>{const m=String(i+1).padStart(2,'0');const v=a.cs.filter(x=>x.date.slice(5,7)===m).reduce((s,x)=>s+num(x.cost),0)+a.es.filter(x=>x.date.slice(5,7)===m).reduce((s,x)=>s+num(x.amount),0);return {m,v}});const max=Math.max(1,...months.map(x=>x.v));return `<section class="hero"><div class="hero-row"><div><div class="eyebrow">Fahrzeugübersicht</div><h2>Dein E‑Auto im Blick.</h2><p>Erfasse Ladungen und Kosten direkt am Handy.</p></div><div class="actions"><button class="btn primary" data-action="add-charge">＋ Laden</button><button class="btn secondary" data-action="add-cost">＋ Kosten</button></div></div></section>${yearSelect()}<section class="cards">${stat('Gesamtkosten',euro(a.total),'Laden und weitere Ausgaben')}${stat('Geladene Energie',number(a.kwh,1)+' kWh',`${a.cs.length} Ladevorgänge`)}${stat('Gefahrene Strecke',number(a.km,0)+' km','aus Kilometerständen berechnet')}${stat('Ø Verbrauch',a.km?number(a.kwh100,1)+' kWh/100 km':'—','seit vorherigem Ladeeintrag')}</section><section class="grid"><div class="panel"><div class="panel-head"><h3>Kosten im Jahresverlauf</h3><span class="hint">pro Monat</span></div><div class="bars">${months.map((x,i)=>`<div class="bar-col"><small>${x.v?euro(x.v,0):''}</small><div class="bar ${i===new Date().getMonth()&&year===new Date().getFullYear()?'emph':''}" style="height:${Math.max(3,x.v/max*100)}%"></div><span>${['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][i]}</span></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><h3>Kennzahlen</h3><span class="hint">${year}</span></div><div class="metric-list"><div class="metric-line"><span>Ladekosten</span><strong>${euro(a.charge)}</strong></div><div class="metric-line"><span>Sonstige Kosten</span><strong>${euro(a.other)}</strong></div><div class="metric-line"><span>Kosten je km</span><strong>${a.km?euro(a.costKm,3):'—'}</strong></div><div class="metric-line"><span>Letzter Kilometerstand</span><strong>${db.charges.length?number(Math.max(...db.charges.map(x=>num(x.odometer))),0)+' km':'—'}</strong></div></div></div></section>`}
function entryActions(kind,x){return `<div class="entry-actions"><button class="btn ghost small" data-action="edit-${kind}" data-id="${esc(x.id)}">Bearbeiten</button><button class="btn danger small" data-action="delete-${kind}" data-id="${esc(x.id)}">Löschen</button></div>`}
function chargesPage(){let list=chargeRows().filter(x=>`${x.provider} ${x.note} ${x.date}`.toLowerCase().includes(searchTerm.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-title"><div><h2>Ladevorgänge</h2><p>${db.charges.length} Einträge · Verbrauch wird aus den Kilometerständen berechnet</p></div><div class="toolbar"><input class="search" id="search" placeholder="Suchen…" value="${esc(searchTerm)}"><button class="btn primary" data-action="add-charge">＋ Laden</button></div></div><div class="list">${list.length?list.map(x=>`<article class="entry"><div class="entry-main"><div class="entry-top"><strong>${dateDE(x.date)}</strong><span class="tag">${number(x.kwh,1)} kWh</span></div><div class="entry-meta">${euro(x.cost)} · ${number(x.odometer,0)} km${x.drivenKm?` · ${number(x.drivenKm,0)} km seit letzter Ladung`:''}${x.kwh100?` · ${number(x.kwh100,1)} kWh/100 km`:''}</div><div class="entry-note">${esc(x.provider||'Anbieter nicht angegeben')}${x.note?' · '+esc(x.note):''}</div></div>${entryActions('charge',x)}</article>`).join(''):`<div class="empty">Noch keine Ladevorgänge. Tippe auf „＋ Laden“, um den ersten Eintrag zu erfassen.</div>`}</div>`}
function costsPage(){let list=[...db.costs].filter(x=>`${x.category} ${x.note} ${x.date}`.toLowerCase().includes(searchTerm.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-title"><div><h2>Sonstige Kosten</h2><p>${db.costs.length} Einträge · Wartung, Versicherung und mehr</p></div><div class="toolbar"><input class="search" id="search" placeholder="Suchen…" value="${esc(searchTerm)}"><button class="btn primary" data-action="add-cost">＋ Kosten</button></div></div><div class="list">${list.length?list.map(x=>`<article class="entry"><div class="entry-main"><div class="entry-top"><strong>${dateDE(x.date)}</strong><span class="tag">${esc(x.category||'Sonstiges')}</span></div><div class="entry-meta">${euro(x.amount)}</div><div class="entry-note">${esc(x.note||'Keine Bemerkung')}</div></div>${entryActions('cost',x)}</article>`).join(''):`<div class="empty">Noch keine Kosten erfasst. Tippe auf „＋ Kosten“, um einen Eintrag anzulegen.</div>`}</div>`}
function syncPage(){return `<div class="page-title"><div><h2>Excel-Austausch</h2><p>CSV-Dateien zwischen App und Excel übertragen.</p></div></div><div class="sync-grid"><section class="sync-card"><h3>Ladevorgänge exportieren</h3><p>Erstellt eine CSV-Datei mit den Excel-Spalten aus „Ladevorgaenge“. Die Datei lässt sich in Excel öffnen.</p><div class="row"><button class="btn primary" data-action="export-charges">CSV herunterladen</button><button class="btn ghost" data-action="import-charges">CSV einlesen</button></div></section><section class="sync-card"><h3>Sonstige Kosten exportieren</h3><p>Erstellt eine CSV-Datei mit ID, Datum, Kostenart, Betrag und Bemerkung.</p><div class="row"><button class="btn primary" data-action="export-costs">CSV herunterladen</button><button class="btn ghost" data-action="import-costs">CSV einlesen</button></div></section><section class="sync-card"><h3>Gesamtsicherung</h3><p>JSON enthält alle App-Daten. Nutze diese Datei als vollständiges Backup oder zum Umzug auf ein anderes Gerät.</p><div class="row"><button class="btn primary" data-action="export-json">Backup herunterladen</button><button class="btn ghost" data-action="import-json">Backup wiederherstellen</button></div></section><section class="sync-card"><h3>So funktioniert der Abgleich</h3><p>CSV-Dateien werden über ihre ID zusammengeführt: gleiche ID aktualisiert den Datensatz, neue ID fügt ihn hinzu. Bestehende Einträge bleiben erhalten.</p><div class="row"><span class="tag">Keine Cloud nötig</span><span class="tag">UTF‑8 · Semikolon</span></div></section></div><div class="notice"><strong>Hinweis zum Excel-Original:</strong> Die Tabellenblätter „Ladevorgaenge“ und „Kosten“ sind in der Arbeitsmappe ausgeblendet. Öffne für den Import eine Kopie der Datei und nutze dort die vorhandenen Excel-Makros bzw. eine sichtbare Importtabelle. Diese App ändert die Originaldatei nicht. Die App kann CSVs aus Excel ebenfalls einlesen; Änderungen werden anhand der ID übernommen.</div>`}
function bind(){const y=$('#year');if(y)y.onchange=()=>{year=Number(y.value);render()};const q=$('#search');if(q)q.oninput=()=>{searchTerm=q.value;const pos=q.selectionStart;if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));}
function action(a,key){if(a==='add-charge')openForm('charge');else if(a==='add-cost')openForm('cost');else if(a==='edit-charge')openForm('charge',key);else if(a==='edit-cost')openForm('cost',key);else if(a==='delete-charge')remove('charges',key);else if(a==='delete-cost')remove('costs',key);else if(a==='export-charges')download(csvCharges(),'Ladevorgaenge.csv');else if(a==='export-costs')download(csvCosts(),'Kosten.csv');else if(a==='export-json')download(JSON.stringify(db,null,2),'E-Auto365-Backup.json','application/json');else if(a==='import-charges')$('#importCharges').click();else if(a==='import-costs')$('#importCosts').click();else if(a==='import-json')$('#importBackup').click();}
function openForm(kind,key){editing={kind,id:key||null};const old=key?(kind==='charge'?db.charges:db.costs).find(x=>x.id===key):null;$('#formTitle').textContent=(old?'Eintrag bearbeiten':'Neuer Eintrag')+(kind==='charge'?' · Ladevorgang':' · Kosten');const today=new Date().toISOString().slice(0,10);if(kind==='charge')$('#formFields').innerHTML=`<div class="field"><label>Datum</label><input name="date" type="date" value="${esc(old?.date||today)}" required></div><div class="field"><label>Kilometerstand</label><input name="odometer" type="number" min="0" step="1" inputmode="numeric" value="${old?esc(old.odometer):''}" placeholder="z. B. 42.150" required></div><div class="field"><label>Geladene Energie (kWh)</label><input name="kwh" type="number" min="0" step="0.01" inputmode="decimal" value="${old?esc(old.kwh):''}" required></div><div class="field"><label>Ladekosten (€)</label><input name="cost" type="number" min="0" step="0.01" inputmode="decimal" value="${old?esc(old.cost):''}" required></div><div class="field full"><label>Ort / Anbieter</label><input name="provider" value="${esc(old?.provider||'')}" placeholder="z. B. Zuhause, EnBW"></div><div class="field full"><label>Bemerkung</label><textarea name="note" placeholder="Optional">${esc(old?.note||'')}</textarea></div>`;else $('#formFields').innerHTML=`<div class="field"><label>Datum</label><input name="date" type="date" value="${esc(old?.date||today)}" required></div><div class="field"><label>Betrag (€)</label><input name="amount" type="number" min="0" step="0.01" inputmode="decimal" value="${old?esc(old.amount):''}" required></div><div class="field full"><label>Kostenart</label><select name="category">${['Wartung','Versicherung','Fahrzeugpflege','Ersatzteile','Reifen','Steuer','Sonstiges'].map(v=>`<option ${old?.category===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Bemerkung</label><textarea name="note" placeholder="Optional">${esc(old?.note||'')}</textarea></div>`;$('#modal').classList.add('open');setTimeout(()=>$('#formFields input')?.focus(),40)}
function closeForm(){$('#modal').classList.remove('open');editing=null}
function remove(bucket,key){if(!confirm('Diesen Eintrag wirklich löschen?'))return;db[bucket]=db[bucket].filter(x=>x.id!==key);saveDB();if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();toast('Eintrag gelöscht')}
$('#entryForm').onsubmit=e=>{e.preventDefault();if(!editing)return;const f=new FormData(e.currentTarget),kind=editing.kind;const obj=kind==='charge'?{id:editing.id||id(),date:f.get('date'),odometer:num(f.get('odometer')),kwh:num(f.get('kwh')),cost:num(f.get('cost')),provider:f.get('provider').trim(),note:f.get('note').trim()}:{id:editing.id||id(),date:f.get('date'),category:f.get('category'),amount:num(f.get('amount')),note:f.get('note').trim()};const bucket=kind==='charge'?'charges':'costs',i=db[bucket].findIndex(x=>x.id===obj.id);if(i>=0)db[bucket][i]=obj;else db[bucket].push(obj);saveDB();closeForm();if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();toast(kind==='charge'?'Ladevorgang gespeichert':'Kosten gespeichert')};
$('#closeModal').onclick=closeForm;$('#cancelForm').onclick=closeForm;$('#modal').onclick=e=>{if(e.target.id==='modal')closeForm()};$$('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;searchTerm='';render()});
function csvCell(v){let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}
function deNum(v){return v==null||v===''?'':String(number(v,2)).replace(/\./g,'')}
function csvText(headers,rows){return '\ufeff'+[headers,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n')}
function csvCharges(){const rows=chargeRows().map(x=>[x.id,dateDE(x.date),number(x.odometer,0),deNum(x.kwh),deNum(x.cost),x.provider,x.note,number(x.drivenKm,0),x.drivenKm?deNum(x.kwh100):'',x.drivenKm?deNum(x.cost100):'',String(x.date).slice(5,7),String(x.date).slice(0,4),`${String(x.date).slice(5,7)}.${String(x.date).slice(0,4)}`]);return csvText(['ID','Datum','Kilometerstand','Geladene_kWh','Ladekosten','Ort_Anbieter','Bemerkung','Gefahrene_km','kWh_pro_100km','Ladekosten_pro_100km','Monat','Jahr','Monat'],rows)}
function csvCosts(){const rows=[...db.costs].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.id,dateDE(x.date),x.category,deNum(x.amount),x.note,String(x.date).slice(5,7),String(x.date).slice(0,4),`${String(x.date).slice(5,7)}.${String(x.date).slice(0,4)}`]);return csvText(['ID','Datum','Kostenart','Betrag','Bemerkung','Monat','Jahr','Periode'],rows)}
function download(text,name,type='text/csv;charset=utf-8'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`${name} erstellt`)}
function parseCSV(text){text=text.replace(/^\ufeff/,'');const line=(text.split(/\r?\n/)[0]||'');let delim=';';if((line.match(/,/g)||[]).length>(line.match(/;/g)||[]).length)delim=',';const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===delim){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.replace(/\r$/,''));if(row.some(x=>x!==''))rows.push(row);return rows}
function norm(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function parseNumber(v){let s=String(v??'').trim().replace(/[€\s]/g,'');if(!s)return 0;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');const n=Number(s);return Number.isFinite(n)?n:0}
function isoDate(v){let s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const m=s.match(/^(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{2,4})$/);if(m){let y=m[3];if(y.length===2)y='20'+y;return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return ''}
function importCSV(text,kind){const rows=parseCSV(text);if(rows.length<2)throw new Error('Die CSV enthält keine Datensätze.');const h=rows[0].map(norm);const idx=(...names)=>{for(const n of names){const i=h.indexOf(norm(n));if(i>=0)return i}return -1},val=(r,...names)=>{const i=idx(...names);return i<0?'':r[i]||''};const incoming=[];for(const r of rows.slice(1)){if(kind==='charges'){const date=isoDate(val(r,'Datum','Date')),odo=parseNumber(val(r,'Kilometerstand','Odometer')),kwh=parseNumber(val(r,'Geladene_kWh','Geladene kWh','kWh')),cost=parseNumber(val(r,'Ladekosten','Kosten')),provider=val(r,'Ort_Anbieter','Ort Anbieter','Anbieter','Ort'),note=val(r,'Bemerkung','Notiz','Note'),recordId=val(r,'ID','Id');if(!date||!odo&&!kwh&&!cost)continue;incoming.push({id:recordId||id(),date,odometer:odo,kwh,cost,provider,note})}else{const date=isoDate(val(r,'Datum','Date')),amount=parseNumber(val(r,'Betrag','Kosten','Amount')),category=val(r,'Kostenart','Kategorie','Category')||'Sonstiges',note=val(r,'Bemerkung','Notiz','Note'),recordId=val(r,'ID','Id');if(!date&&amount===0)continue;incoming.push({id:recordId||id(),date,category,amount,note})}}if(!incoming.length)throw new Error('Keine passenden Datenzeilen gefunden. Bitte die CSV mit den Excel-Spalten exportieren.');const bucket=kind==='charges'?'charges':'costs',map=new Map(db[bucket].map(x=>[x.id,x]));incoming.forEach(x=>map.set(x.id,x));db[bucket]=[...map.values()];saveDB();if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();return incoming.length}
function handleImport(file,kind){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const n=importCSV(String(reader.result||''),kind);toast(`${n} Datensätze übernommen`)}catch(e){toast(e.message||'Import fehlgeschlagen')}};reader.onerror=()=>toast('Datei konnte nicht gelesen werden');reader.readAsText(file,'UTF-8')}
$('#importCharges').onchange=e=>{handleImport(e.target.files[0],'charges');e.target.value=''};$('#importCosts').onchange=e=>{handleImport(e.target.files[0],'costs');e.target.value=''};$('#importBackup').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.charges)||!Array.isArray(x.costs))throw 0;if(!confirm('Backup einlesen? Einträge mit gleicher ID werden ersetzt, andere bleiben erhalten.'))return;for(const k of ['charges','costs']){const m=new Map(db[k].map(v=>[v.id,v]));x[k].forEach(v=>m.set(v.id,v));db[k]=[...m.values()]}saveDB();if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();toast('Backup eingelesen')}catch{toast('Das Backup ist ungültig')}};r.readAsText(f);e.target.value=''};
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();
